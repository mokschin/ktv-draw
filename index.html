<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101020"><title>今晚唱什么 · 抽歌转盘</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="brand"><span class="logo">♪</span><div><b>今晚唱什么</b><small>把歌交给运气</small></div></div><button id="editBtn" class="quiet" hidden>编辑歌单</button></header><section id="importView" class="panel import"><div class="eyebrow">01 / 歌单准备</div><h1>先把歌放进来</h1><p class="hint">粘贴歌名，或上传歌单截图。确认识别结果后开始抽。</p><label for="rawText">歌曲文字</label><textarea id="rawText" placeholder="周杰伦 - 晴天&#10;林俊杰 - 修炼爱情&#10;孙燕姿 - 遇见"></textarea><div class="upload-row"><label class="upload" for="images">＋ 添加图片 <span>JPG · PNG · WebP</span></label><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><span id="fileCount">尚未选择图片</span></div><details class="api"><summary>DeepSeek Flash 识别设置</summary><label for="apiKey">API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"><p>图片和杂乱文字需要 DeepSeek Flash。密钥仅保留在当前页面内存中，不写入歌单或本地存储；浏览器会直接向 DeepSeek 发送内容。</p></details><div class="actions"><button id="parseBtn" class="primary">智能识别歌单</button><button id="plainBtn" class="secondary">按行直接导入</button></div><p id="importError" class="error" role="alert"></p></section><section id="reviewView" class="panel" hidden><div class="eyebrow">02 / 核对歌单</div><h1>看看识别得对不对</h1><p class="hint">每行一首，可以直接修改、补充或删除。</p><textarea id="reviewText" aria-label="待确认歌单"></textarea><p id="reviewCount" class="meta"></p><div class="actions"><button id="confirmBtn" class="primary">确认并开始</button><button id="backBtn" class="secondary">返回修改</button></div></section><section id="gameView" hidden><div class="topline"><div><span class="eyebrow">抽歌转盘</span><h1 id="statusTitle">转起来，看看今晚唱什么</h1></div><div class="counts"><strong id="remaining">0</strong><span>剩余 / <span id="total">0</span></span></div></div><div class="wheel-stage"><div class="pointer"></div><canvas id="wheel" width="900" height="900" aria-label="抽歌转盘"></canvas><button id="spinBtn" class="spin">抽一首</button></div><div class="result" id="result" aria-live="polite"><small>上一首抽到</small><strong id="resultName">还没有抽取</strong></div><div class="bottom-actions"><button id="resetBtn" class="quiet">重新开始本轮</button><span id="drawCount">已抽 0 首</span></div><details class="history"><summary>抽取记录 <span id="historyCount">0</span></summary><ol id="historyList"></ol></details></section><footer>一个手机，轮流抽歌 · 进度保存在这台设备</footer></main><script src="app.js"></script></body></html>
