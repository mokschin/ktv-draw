<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101020"><title>今晚唱什么 · 抽歌转盘</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="brand"><span class="logo">♪</span><div><b>今晚唱什么</b></div></div><button id="editBtn" class="quiet" hidden>编辑歌单</button></header><section id="importView" class="panel import"><h1>先把歌放进来</h1><label for="rawText">歌曲文字</label><textarea id="rawText" placeholder="晴天 - 周杰伦&#10;修炼爱情 - 林俊杰&#10;遇见 - 孙燕姿"></textarea><div class="upload-row"><label class="upload" for="images">＋ 添加图片 <span>JPG · PNG · WebP</span></label><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><span id="fileCount">尚未选择图片</span></div><details class="api"><summary>智能识别设置</summary><label for="apiKey">API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"></details><div class="actions"><button id="parseBtn" class="primary">智能识别歌单</button><button id="plainBtn" class="secondary">按行直接导入</button></div><p id="importError" class="error" role="alert"></p></section><section id="reviewView" class="panel" hidden><h1>看看识别得对不对</h1><textarea id="reviewText" aria-label="待确认歌单"></textarea><p id="reviewCount" class="meta"></p><div class="actions"><button id="confirmBtn" class="primary">确认并开始</button><button id="backBtn" class="secondary">返回修改</button></div></section><section id="gameView" hidden><div class="topline"><div><h1 id="statusTitle">转起来，看看今晚唱什么</h1></div><div class="counts"><strong id="remaining">0</strong><span>剩余 / <span id="total">0</span></span></div></div><div class="wheel-stage"><div class="pointer"></div><canvas id="wheel" width="900" height="900" aria-label="抽歌转盘"></canvas><button id="spinBtn" class="spin">抽一首</button></div><div class="result" id="result" aria-live="polite"><small>上一首抽到</small><strong id="resultName">还没有抽取</strong></div><div class="bottom-actions"><button id="resetBtn" class="quiet">重新开始本轮</button><span id="drawCount">已抽 0 首</span></div><details class="history"><summary>抽取记录 <span id="historyCount">0</span></summary><ol id="historyList"></ol></details></section></main><script src="app.js"></script></body></html>
